    <noscript>
      <h1>Iepirkumu risku platforma</h1>
      <p>
        Publisks, bezmaksas pilsoniskais rīks Latvijas publisko iepirkumu korupcijas un konkurences
        risku analīzei. Apkopo atvērtos datus no Iepirkumu uzraudzības biroja (IUB) un Uzņēmumu
        reģistra (UR) un aprēķina riska rādītājus katram pasūtītājam, piegādātājam un nozarei.
        Tiek analizēta visa pieejamā iepirkumu vēsture no 2023. gada — vairāk nekā 65 000 līgumu,
        ap 900 pasūtītāju un 6 500 piegādātāju, kopā par vairāk nekā 15 miljardiem eiro.
      </p>
      <p>
        <strong>Karogs nav pārkāpuma pierādījums</strong> — tikai norāde, kur vērts ieskatīties
        dziļāk. Metodoloģija ir konservatīva un balstīta uz starptautisku korupcijas risku rādītāju
        praksi.
      </p>
      <h2>Riska rādītāji</h2>
      <ul>
        <li><strong>B — Viena pretendenta īpatsvars:</strong> cik bieži pieteicies tikai viens piegādātājs.</li>
        <li><strong>B2 — Uzvarētāju koncentrācija:</strong> vai dažas firmas iegūst nesamērīgi daudz līgumu.</li>
        <li><strong>A — Iepirkumu sadalīšana:</strong> lielu iepirkumu mākslīga dalīšana zem sliekšņiem.</li>
        <li><strong>C — Cenu/vērtības novirze:</strong> neparasti augstas līgumu vērtības nozarē.</li>
        <li><strong>D — Saistītās puses:</strong> jaunas firmas ar lieliem līgumiem, kopīgi īpašnieki, holdingu ķēdes.</li>
        <li><strong>E — Procedūras integritāte:</strong> nekonkurējošu procedūru īpatsvars.</li>
        <li><strong>G — Līguma grozījumi:</strong> būtiska vērtības palielināšana pēc noslēgšanas.</li>
        <li><strong>Slēgtais tirgus:</strong> atkārtoti vieni un tie paši uzvarētāji šaurā tirgū.</li>
      </ul>
      <h2>Sadaļas</h2>
      <p>
        Pārskats, Pasūtītāji, Piegādātāji, Personas, Nozares, Slēgtie tirgi, Aktuālie konkursi un
        Metodoloģija.
      </p>
      <p>
        Datu avoti: Iepirkumu uzraudzības birojs (open.iub.gov.lv) un Latvijas Uzņēmumu reģistrs.
        Dati tiek atjaunoti automātiski katru dienu. Rīks ir neatkarīgs, nekomerciāls un nav saistīts
        ar valsts iestādēm. Šim rīkam nepieciešams JavaScript pilnai darbībai.
      </p>
